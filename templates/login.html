{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Masuk</h1>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" required maxlength="30" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
    <button class="btn" type="submit">Masuk</button>
  </form>
  <p>Belum punya akun? <a href="{{ url_for('register') }}">Daftar</a></p>
</section>
{% endblock %}
